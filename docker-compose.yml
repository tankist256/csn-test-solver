services:
  # Main service: the question search and answer page at http://localhost:8080.
  solver:
    build: .
    container_name: csn-solver
    ports:
      - "8080:8080"
    environment:
      CSN_COLLECTOR_TOKEN: ${CSN_COLLECTOR_TOKEN:-}
      CSN_REMOTE_WORKER: ${CSN_REMOTE_WORKER:-0}
      AUTH_ENABLED: ${AUTH_ENABLED:-0}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_TENANT_SUBDOMAIN: ${ENTRA_TENANT_SUBDOMAIN:-}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:-}
      ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
      ENTRA_REQUIRED_SCOPE: ${ENTRA_REQUIRED_SCOPE:-}
      AUTH_DEFAULT_USER_ROLE: ${AUTH_DEFAULT_USER_ROLE:-1}
      ENTRA_OPENID_CONFIG_URL: ${ENTRA_OPENID_CONFIG_URL:-}
      AZURE_TABLES_CONNECTION_STRING: ${AZURE_TABLES_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
    volumes:
      - ./solver:/app/solver
    restart: unless-stopped

  # Background service that collects questions from CSDD tests.
  collector:
    build: .
    container_name: csn-collector
    volumes:
      - ./solver:/app/solver
    command: ["python", "solver/collector.py", "--rounds", "20"]

  # Parser for the written Latvian road traffic rules.
  parser-csn:
    build: .
    container_name: csn-parser
    volumes:
      - ./csn_materials:/app/csn_materials
    command: ["python", "parser.py", "--lang", "lv"]

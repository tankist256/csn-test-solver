<!doctype html>
<html lang="lv" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>CSDD teorija — B kategorijas jautājumi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="mode-solver">
    <div id="root"></div>
    <script>
      const startApp = () => {
        const app = document.createElement("script");
        if (location.protocol === "file:") {
          app.src = "dist/standalone/standalone.js";
        } else {
          app.type = "module";
          app.src = "/src/main.jsx";
        }
        document.body.append(app);
      };
      const questionData = document.createElement("script");
      questionData.src = "./questions.js";
      questionData.onload = startApp;
      questionData.onerror = startApp;
      if (location.protocol === "file:" || location.pathname === "/answers") {
        document.head.append(questionData);
      } else {
        startApp();
      }
    </script>
  </body>
</html>

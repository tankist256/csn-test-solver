<!DOCTYPE html>
<html lang="lv" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSDD Exam Test Solver & Question Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-solver">

  <header class="app-header">
    <div class="header-top">
      <div class="logo-area">
        <span class="badge-csdd">CSDD B</span>
        <h1 class="app-title">Exam Test Solver</h1>
      </div>
      <div class="header-controls">
        <button id="collector-open-btn" class="btn btn-primary" title="Получить новые вопросы и ответы с CSDD">
          <span>↻</span> <strong>Пополнить базу</strong>
        </button>
        <button id="mode-toggle-btn" class="btn" title="Переключить режим шпаргалка / тренажер">
          <span>🎯</span> <strong>Шпаргалка</strong>
        </button>
        <button id="theme-toggle-btn" class="btn" title="Сменить тему">🌙</button>
      </div>
    </div>

    <div class="search-box-container">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Meklēt jautājumu vai atbildi (piem. tramvajs, atļauts, autobusam, 201...)" 
          autocomplete="off"
          autofocus
        >
        <button id="clear-search-btn" class="clear-search-btn" title="Notīrīt meklēšanu">✕</button>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-tags">
        <button class="filter-btn active" data-filter="all">Visi (Все)</button>
        <button class="filter-btn" data-filter="images">Ar attēliem (С 3D-фото)</button>
        <button class="filter-btn" data-filter="videos">Video (Видео)</button>
        <button class="filter-btn" data-filter="bookmarks">⭐ Saglabātie (Избранное)</button>
      </div>
      <div id="stats-counter" class="stats-counter">Ielādē...</div>
    </div>
  </header>

  <main class="main-content">
    <div id="questions-container" class="questions-grid">
      <!-- Карточки вопросов будут рендериться динамически -->
    </div>
  </main>

  <div id="collector-modal" class="dialog-backdrop" aria-hidden="true">
    <section class="collector-dialog" role="dialog" aria-modal="true" aria-labelledby="collector-title">
      <div class="dialog-header">
        <div>
          <div class="dialog-kicker">Официальный тест CSDD</div>
          <h2 id="collector-title">Пополнение базы</h2>
        </div>
        <button id="collector-close-btn" class="dialog-close" title="Закрыть">✕</button>
      </div>

      <p class="dialog-description">
        Один проход получает 30 тестовых вопросов, затем читает правильные ответы на странице результатов CSDD.
      </p>

      <div class="collector-form">
        <label for="collector-rounds">
          Количество тестов
          <small>Обычно достаточно 1–5</small>
        </label>
        <div class="rounds-control">
          <input id="collector-rounds" type="number" min="1" max="50" value="1" inputmode="numeric">
          <button id="collector-start-btn" class="btn btn-primary collector-start-btn">
            <span>▶</span> Запустить сбор
          </button>
        </div>
      </div>

      <div id="collector-status" class="collector-status idle">
        <div class="status-line">
          <span id="collector-status-dot" class="status-dot"></span>
          <strong id="collector-status-title">Готово к запуску</strong>
        </div>
        <div id="collector-status-text" class="status-text">Сервер проверит доступность сборщика.</div>
        <div class="progress-track" aria-hidden="true"><div id="collector-progress" class="progress-bar"></div></div>
        <pre id="collector-log" class="collector-log" aria-live="polite"></pre>
      </div>
    </section>
  </div>

  <!-- Модальное окно Lightbox для просмотра 3D картинок на весь экран -->
  <div id="lightbox-modal" class="lightbox-modal">
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close" title="Aizvērt">✕</button>
      <img id="lightbox-img" src="" alt="Attēls palielinājumā">
    </div>
  </div>

  <!-- База вопросов в формате JS для работы автономно без веб-сервера -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>

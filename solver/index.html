<!DOCTYPE html>
<html lang="lv" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSDD teorija — B kategorijas jautājumi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-solver">

  <header class="app-header">
    <div class="header-top">
      <div class="logo-area">
        <span class="badge-csdd">CSDD B</span>
        <h1 class="app-title">CSDD teorija</h1>
      </div>
      <div class="header-controls">
        <button id="mode-toggle-btn" class="btn mode-toggle-btn" title="Pārslēgt režīmu" aria-label="Režīms: Atbilžu lapa">
          <span aria-hidden="true">🎯</span> <strong>Atbilžu lapa</strong>
        </button>
        <button id="theme-toggle-btn" class="btn icon-btn" title="Mainīt krāsu režīmu" aria-label="Mainīt krāsu režīmu">🌙</button>
        <button id="collector-open-btn" class="btn btn-primary collector-open-btn" title="Papildināt jautājumu datubāzi" aria-label="Papildināt jautājumu datubāzi" hidden>
          <span aria-hidden="true">↻</span> <strong>Papildināt jautājumus</strong>
        </button>
      </div>
    </div>

    <div class="search-box-container">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Meklēt jautājumu vai atbildi…"
          autocomplete="off"
          aria-label="Meklēt jautājumus un atbildes"
        >
        <button id="clear-search-btn" class="clear-search-btn" title="Notīrīt meklēšanu" aria-label="Notīrīt meklēšanu">✕</button>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-tags">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">Visi jautājumi</button>
        <button class="filter-btn" data-filter="images" aria-pressed="false">Ar attēliem</button>
        <button class="filter-btn" data-filter="videos" aria-pressed="false">Video</button>
        <button class="filter-btn" data-filter="bookmarks" aria-pressed="false">★ Izlase</button>
      </div>
      <div id="stats-counter" class="stats-counter">Ielādē…</div>
    </div>
  </header>

  <main class="main-content">
    <div id="questions-container" class="questions-grid">
      <!-- Desktop uses cards. Mobile uses a 2 by 3 grid. -->
    </div>
    <button id="load-more-btn" class="btn load-more-btn" type="button" hidden>Parādīt vēl jautājumus</button>
    <nav id="questions-pagination" class="questions-pagination" aria-label="Jautājumu lapas" hidden>
      <button id="previous-page-btn" class="btn page-btn" type="button">← Iepriekšējā</button>
      <span id="page-indicator" class="page-indicator" aria-live="polite"></span>
      <button id="next-page-btn" class="btn page-btn" type="button">Nākamā →</button>
    </nav>
  </main>

  <div id="question-modal" class="dialog-backdrop question-backdrop" aria-hidden="true">
    <section class="question-dialog" role="dialog" aria-modal="true" aria-label="Jautājums un atbilžu varianti">
      <button id="question-close-btn" class="dialog-close question-close" type="button" aria-label="Aizvērt jautājumu">✕</button>
      <div id="question-detail"></div>
    </section>
  </div>

  <div id="collector-modal" class="dialog-backdrop" aria-hidden="true">
    <section class="collector-dialog" role="dialog" aria-modal="true" aria-labelledby="collector-title">
      <div class="dialog-header">
        <div>
          <div class="dialog-kicker">Oficiālais CSDD tests</div>
          <h2 id="collector-title">Datubāzes papildināšana</h2>
        </div>
        <button id="collector-close-btn" class="dialog-close" title="Aizvērt" aria-label="Aizvērt">✕</button>
      </div>

      <p id="collector-description" class="dialog-description">
        Vienā reizē tiek iegūti 30 testa jautājumi, pēc tam CSDD rezultātu lapā tiek nolasītas pareizās atbildes.
      </p>

      <div id="collector-token-field" class="collector-token-field" hidden>
        <label for="collector-token">Piekļuves atslēga</label>
        <input id="collector-token" type="password" autocomplete="off" placeholder="Ievadiet administratora atslēgu">
      </div>

      <div class="collector-form">
        <label for="collector-rounds">
          Testu skaits
          <small>Parasti pietiek ar 1–5</small>
        </label>
        <div class="rounds-control">
          <input id="collector-rounds" type="number" min="1" max="50" value="1" inputmode="numeric">
          <button id="collector-start-btn" class="btn btn-primary collector-start-btn">
            <span>▶</span> Sākt jautājumu ievākšanu
          </button>
        </div>
      </div>

      <div id="collector-status" class="collector-status idle">
        <div class="status-line">
          <span id="collector-status-dot" class="status-dot"></span>
          <strong id="collector-status-title">Gatavs darbam</strong>
        </div>
        <div id="collector-status-text" class="status-text">Serveris pārbaudīs, vai jautājumu ievācējs ir pieejams.</div>
        <div class="progress-track" aria-hidden="true"><div id="collector-progress" class="progress-bar"></div></div>
        <details id="collector-log-details" class="collector-log-details" hidden>
          <summary id="collector-log-summary">Ievākšanas žurnāls</summary>
          <div id="collector-log-result" class="status-text"></div>
          <pre id="collector-log" class="collector-log" aria-live="polite"></pre>
        </details>
      </div>
    </section>
  </div>

  <!-- Show a road situation image at full size. -->
  <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" aria-label="Ceļu satiksmes situācijas attēls" aria-hidden="true">
    <button id="lightbox-zoom" class="lightbox-zoom" title="Palielināt attēlu" aria-label="Palielināt attēlu">＋</button>
    <button id="lightbox-close" class="lightbox-close" title="Aizvērt" aria-label="Aizvērt">✕</button>
    <div id="lightbox-content" class="lightbox-content">
      <img id="lightbox-img" src="" alt="Ceļu satiksmes situācija tuvplānā">
    </div>
  </div>

  <!-- Load the question bank for direct use without a web server. -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>

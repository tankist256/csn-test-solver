<!doctype html>
<html lang="lv" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Neoficiāls B kategorijas teorijas mācību rīks: pārbaudītas atbildes, treniņrežīms un personīgie testi." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="lv_LV" />
    <meta property="og:title" content="B kategorijas teorija — jautājumi un testi" />
    <meta property="og:description" content="Pārbaudi atbildes, trenējies un seko līdzi savam progresam." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='39' font-weight='700' fill='white'%3EB%3C/text%3E%3C/svg%3E" />
    <title>B kategorijas teorija — jautājumi un testi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="mode-solver">
    <div id="root"></div>
    <script>
      const startApp = () => {
        const app = document.createElement("script");
        if (location.protocol === "file:") {
          app.src = "dist/standalone/standalone.js";
        } else {
          app.type = "module";
          app.src = "/src/main.jsx";
        }
        document.body.append(app);
      };
      const questionData = document.createElement("script");
      questionData.src = "./questions.js";
      questionData.onload = startApp;
      questionData.onerror = startApp;
      if (location.protocol === "file:" || location.pathname === "/answers") {
        document.head.append(questionData);
      } else {
        startApp();
      }
    </script>
  </body>
</html>
